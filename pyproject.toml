[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "da-diff"
version = "0.1.0"
description = "JAX kernel of DA-Diff and DA-CIT (arXiv:2609.33490)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax>=0.4.20",
    "numpy>=1.24",
]

[project.optional-dependencies]
tests = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
